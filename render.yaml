services:
  - type: web
    name: kasparro-backend
    env: python
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kasparro-db
          property: connectionString
      - key: COINPAPRIKA_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false

databases:
  - name: kasparro-db
    plan: free
    region: oregon
